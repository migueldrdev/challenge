# =============================================================================
# CONFIGURACIÓN NGINX PARA PRODUCCIÓN
# =============================================================================
# Configuración optimizada y segura para entornos de producción.
#
# DIFERENCIAS CON DESARROLLO:
# - Headers de seguridad
# - Compresión gzip habilitada
# - Caché más agresivo
# - Sin logs de acceso detallados
# - Rate limiting
# =============================================================================

# Rate limiting para prevenir abuso
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Logs - formato combinado para análisis
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Límite de tamaño de uploads
    client_max_body_size 50M;

    # -------------------------------------------------------------------------
    # HEADERS DE SEGURIDAD
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    # -------------------------------------------------------------------------
    # COMPRESIÓN GZIP
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # -------------------------------------------------------------------------
    # HEALTH CHECK
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # API - Con rate limiting
    # -------------------------------------------------------------------------
    location /api {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # LOCATION PRINCIPAL
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=general burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeouts para reportes
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # -------------------------------------------------------------------------
    # STORAGE - Reportes generados
    # -------------------------------------------------------------------------
    location /storage {
        alias /var/www/html/storage/app/public;

        # Headers para archivos Excel
        location ~* \.(xlsx|xls|csv)$ {
            add_header Content-Disposition 'attachment';
            add_header Cache-Control 'private, no-cache';
        }
    }

    # -------------------------------------------------------------------------
    # ASSETS - Caché agresivo
    # -------------------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # SEGURIDAD - Bloquear archivos sensibles
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|yml|yaml|ini|conf|sql|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(artisan|composer|phpunit) {
        deny all;
    }

    location = /robots.txt { access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
