# =============================================================================
# CONFIGURACIÓN NGINX PARA LARAVEL
# =============================================================================
# Este archivo configura Nginx como servidor web para la aplicación Laravel.
#
# FUNCIONES:
# 1. Servir archivos estáticos (CSS, JS, imágenes) directamente
# 2. Proxy requests PHP a PHP-FPM (contenedor 'app')
# 3. Configurar headers de seguridad
# 4. Optimizar caché de assets
# 5. Servir reportes Excel generados desde storage/app/public
#
# FLUJO DE UNA PETICIÓN:
# Cliente -> Nginx:80 -> (si es .php) -> PHP-FPM:9000 -> Laravel -> Respuesta
#                     -> (si es estático) -> Archivo -> Respuesta
# =============================================================================

# Resolver DNS de Docker (necesario para resolver nombres de servicios)
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    # Puerto de escucha (dentro del contenedor)
    listen 80;
    listen [::]:80;

    # Nombre del servidor (para virtual hosts, no crítico en desarrollo)
    server_name localhost;

    # Raíz del documento - apunta al directorio public de Laravel
    # IMPORTANTE: Laravel expone solo /public, nunca la raíz del proyecto
    root /var/www/html/public;

    # Archivo index por defecto
    index index.php index.html;

    # Charset UTF-8 para caracteres especiales (nombres, direcciones, etc.)
    charset utf-8;

    # Variable para el upstream de PHP-FPM (evita error si app no está listo)
    set $upstream_app app:9000;

    # -------------------------------------------------------------------------
    # LOGS - Configuración de logging
    # -------------------------------------------------------------------------
    # En desarrollo, logs detallados ayudan al debugging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # -------------------------------------------------------------------------
    # LÍMITES DE TAMAÑO - Importante para uploads
    # -------------------------------------------------------------------------
    # Tamaño máximo de body (para uploads de archivos)
    client_max_body_size 100M;

    # -------------------------------------------------------------------------
    # ENDPOINT DE HEALTH CHECK
    # -------------------------------------------------------------------------
    # Usado por Docker healthcheck y load balancers
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # LOCATION PRINCIPAL - Maneja todas las rutas de Laravel
    # -------------------------------------------------------------------------
    # try_files intenta:
    # 1. Servir el archivo si existe ($uri)
    # 2. Servir el directorio si existe ($uri/)
    # 3. Enviar a index.php con query string (Laravel router)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM - Procesamiento de archivos PHP
    # -------------------------------------------------------------------------
    # Todas las peticiones a .php se envían al contenedor PHP-FPM
    location ~ \.php$ {
        # Verificar que el archivo existe (seguridad)
        try_files $uri =404;

        # Configuración FastCGI
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Conexión a PHP-FPM usando variable (resuelve DNS en runtime)
        # Esto evita el error "host not found" al iniciar Nginx
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;

        # Variables FastCGI necesarias
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeouts para requests largos (reportes masivos)
        # IMPORTANTE: GenerateCreditReportJob tiene timeout de 1200s
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Buffer sizes para respuestas grandes
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # -------------------------------------------------------------------------
    # STORAGE - Acceso a reportes generados
    # -------------------------------------------------------------------------
    # Laravel guarda reportes en storage/app/public/reports/
    # Este bloque permite acceso directo a estos archivos
    location /storage {
        alias /var/www/html/storage/app/public;

        # Headers para descarga de archivos Excel
        location ~* \.(xlsx|xls|csv)$ {
            add_header Content-Disposition 'attachment';
            add_header Cache-Control 'no-cache';
        }
    }

    # -------------------------------------------------------------------------
    # ASSETS ESTÁTICOS - CSS, JS, imágenes
    # -------------------------------------------------------------------------
    # Configuración de caché para assets compilados por Vite
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Caché por 1 año (los assets de Vite tienen hash en el nombre)
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Desactivar log para assets (reduce ruido en logs)
        access_log off;

        # Intentar servir el archivo o retornar 404
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # SEGURIDAD - Bloquear acceso a archivos sensibles
    # -------------------------------------------------------------------------
    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear acceso a archivos de configuración
    location ~* \.(env|log|yml|yaml|ini|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # ROBOTS.TXT - SEO (no crítico para API)
    # -------------------------------------------------------------------------
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # FAVICON - Evitar logs de error por favicon
    # -------------------------------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
