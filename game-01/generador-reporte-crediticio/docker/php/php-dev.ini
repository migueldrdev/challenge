; =============================================================================
; CONFIGURACIÓN PHP PARA DESARROLLO
; =============================================================================
; Este archivo contiene configuraciones de PHP optimizadas para desarrollo local.
;
; CARACTERÍSTICAS:
; - Errores visibles para debugging
; - Más memoria disponible para depuración
; - Sin límites de tiempo para debugging paso a paso
; - Opcache deshabilitado para ver cambios inmediatamente
;
; ADVERTENCIA: NUNCA usar esta configuración en producción
; =============================================================================

; -----------------------------------------------------------------------------
; MANEJO DE ERRORES - Visibles para desarrollo
; -----------------------------------------------------------------------------
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php/error.log

; -----------------------------------------------------------------------------
; LÍMITES DE RECURSOS - Generosos para debugging
; -----------------------------------------------------------------------------
; memory_limit: Alto para manejar reportes grandes durante desarrollo
memory_limit = 512M

; upload_max_filesize: Permite subir archivos grandes para testing
upload_max_filesize = 100M
post_max_size = 108M

; max_execution_time: Sin límite para debugging paso a paso
max_execution_time = 0
max_input_time = -1

; -----------------------------------------------------------------------------
; OPCACHE - Deshabilitado para ver cambios inmediatamente
; -----------------------------------------------------------------------------
; En desarrollo queremos ver los cambios sin necesidad de limpiar cache
opcache.enable = 0
opcache.enable_cli = 0

; -----------------------------------------------------------------------------
; SESIONES
; -----------------------------------------------------------------------------
session.gc_maxlifetime = 1440
session.cookie_secure = Off

; -----------------------------------------------------------------------------
; TIMEZONE - Importante para reportes con fechas correctas
; -----------------------------------------------------------------------------
date.timezone = America/Mexico_City

; -----------------------------------------------------------------------------
; CONFIGURACIÓN ESPECIAL PARA EXCEL/FASTEXCEL
; -----------------------------------------------------------------------------
; Aumentar límites para procesamiento de archivos Excel grandes
; Esto es crucial para el generador de reportes crediticios masivos
max_input_vars = 5000
