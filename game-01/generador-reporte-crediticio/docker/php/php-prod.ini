; =============================================================================
; CONFIGURACIÓN PHP PARA PRODUCCIÓN
; =============================================================================
; Este archivo contiene configuraciones de PHP optimizadas para producción.
;
; CARACTERÍSTICAS:
; - Errores ocultos al usuario (solo en logs)
; - OPcache habilitado y optimizado para máximo rendimiento
; - Límites de memoria controlados
; - Seguridad reforzada
;
; IMPORTANTE: Revisar y ajustar según los recursos del servidor
; =============================================================================

; -----------------------------------------------------------------------------
; MANEJO DE ERRORES - Ocultos al usuario, solo en logs
; -----------------------------------------------------------------------------
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/log/php/error.log

; -----------------------------------------------------------------------------
; LÍMITES DE RECURSOS - Controlados para producción
; -----------------------------------------------------------------------------
; memory_limit: Suficiente para reportes pero controlado
; NOTA: Para reportes de 10M+ registros, el streaming mantiene esto bajo
memory_limit = 256M

; upload_max_filesize: Límite razonable
upload_max_filesize = 50M
post_max_size = 55M

; max_execution_time: Límite para requests HTTP (los jobs tienen su propio timeout)
max_execution_time = 30
max_input_time = 60

; -----------------------------------------------------------------------------
; OPCACHE - Habilitado y optimizado para producción
; -----------------------------------------------------------------------------
; OPcache pre-compila PHP bytecode para mejor rendimiento
opcache.enable = 1
opcache.enable_cli = 1

; Memoria para scripts cacheados (ajustar según tamaño del proyecto)
opcache.memory_consumption = 256

; Número máximo de scripts en cache
opcache.max_accelerated_files = 20000

; Validación de timestamps deshabilitada (los archivos no cambian en prod)
opcache.validate_timestamps = 0

; Guardar comentarios (necesario para algunas librerías como Doctrine)
opcache.save_comments = 1

; Preloading (Laravel 8+) - Descomentar y configurar si se usa
; opcache.preload = /var/www/html/preload.php
; opcache.preload_user = laravel

; -----------------------------------------------------------------------------
; SEGURIDAD
; -----------------------------------------------------------------------------
; Ocultar versión de PHP
expose_php = Off

; Desactivar funciones peligrosas
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Prevenir path disclosure
cgi.fix_pathinfo = 0

; -----------------------------------------------------------------------------
; SESIONES - Seguras para producción
; -----------------------------------------------------------------------------
session.gc_maxlifetime = 1440
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = Strict

; -----------------------------------------------------------------------------
; TIMEZONE
; -----------------------------------------------------------------------------
date.timezone = America/Mexico_City

; -----------------------------------------------------------------------------
; CONFIGURACIÓN PARA REPORTES MASIVOS
; -----------------------------------------------------------------------------
; Optimizado para streaming - no necesita mucha memoria gracias a cursors
max_input_vars = 3000

; Realpath cache para mejor rendimiento de includes
realpath_cache_size = 4096K
realpath_cache_ttl = 600
