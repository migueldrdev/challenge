# =============================================================================
# DOCKER COMPOSE - Orquestación de Servicios para PRODUCCIÓN
# =============================================================================
# Este archivo define la configuración de Docker Compose optimizada para
# entornos de producción. Diseñado para ser seguro, eficiente y escalable.
#
# DIFERENCIAS CON DESARROLLO:
# 1. Sin volúmenes de código (imagen contiene todo el código)
# 2. Sin servicios de desarrollo (mailpit, node)
# 3. Configuración de seguridad reforzada
# 4. Optimizaciones de rendimiento
# 5. Health checks más estrictos
# 6. Logging estructurado
#
# USO:
#   docker compose -f docker-compose.prod.yml up -d
#
# CONSIDERACIONES:
# - Requiere imagen pre-construida (CI/CD pipeline)
# - Variables de entorno desde secrets o vault
# - SSL/TLS debe configurarse en reverse proxy externo o Nginx
# - Backup de volúmenes de datos debe configurarse
# =============================================================================

version: '3.8'

services:

  # ---------------------------------------------------------------------------
  # APP - Contenedor PHP-FPM (Producción)
  # ---------------------------------------------------------------------------
  app:
    # Usar imagen pre-construida de tu registry
    # Ejemplo: ghcr.io/tu-org/creditreport:latest
    image: ${DOCKER_REGISTRY:-creditreport}/app:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production  # Stage de producción
    container_name: creditreport_app_prod
    restart: always  # Siempre reiniciar en producción

    # Sin volúmenes de código - todo está en la imagen
    volumes:
      # Solo storage para archivos generados (reportes)
      - storage_data:/var/www/html/storage/app/public
      # Logs persistentes
      - app_logs:/var/www/html/storage/logs

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      REDIS_HOST: redis
      # Las demás variables vienen del archivo .env

    networks:
      - creditreport_network_prod

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging estructurado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # NGINX - Servidor Web (Producción)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: creditreport_nginx_prod
    restart: always

    ports:
      - "${APP_PORT:-80}:80"
      # Descomentar si usas SSL directo (no recomendado, usar reverse proxy)
      # - "443:443"

    volumes:
      # Configuración de Nginx para producción
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Acceso a archivos públicos
      - storage_data:/var/www/html/storage/app/public:ro
      # Logs de Nginx
      - nginx_logs:/var/log/nginx

    networks:
      - creditreport_network_prod

    depends_on:
      app:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 128M

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # DB - MySQL (Producción)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: creditreport_db_prod
    restart: always

    # NO exponer puerto externamente en producción
    # ports:
    #   - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./docker/mysql/my.prod.cnf:/etc/mysql/conf.d/custom.cnf:ro
      # Backup directory
      - mysql_backups:/var/backups/mysql

    networks:
      - creditreport_network_prod

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # REDIS - Cache y Colas (Producción)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: creditreport_redis_prod
    restart: always

    # NO exponer puerto externamente en producción

    # Configuración con persistencia y contraseña
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_data_prod:/data

    networks:
      - creditreport_network_prod

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # QUEUE - Worker para Jobs (Producción)
  # ---------------------------------------------------------------------------
  # ESCALABILIDAD: Puedes escalar este servicio según demanda
  #   docker compose -f docker-compose.prod.yml up -d --scale queue=5
  # ---------------------------------------------------------------------------
  queue:
    image: ${DOCKER_REGISTRY:-creditreport}/app:${APP_VERSION:-latest}
    container_name: creditreport_queue_prod
    restart: always

    command: >
      php artisan queue:work redis
      --sleep=3
      --tries=3
      --max-time=3600
      --memory=256

    volumes:
      - storage_data:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs

    environment:
      APP_ENV: production
      QUEUE_CONNECTION: redis

    networks:
      - creditreport_network_prod

    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      # Para escalar workers
      replicas: 2

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # SCHEDULER - Tareas Programadas (Producción)
  # ---------------------------------------------------------------------------
  scheduler:
    image: ${DOCKER_REGISTRY:-creditreport}/app:${APP_VERSION:-latest}
    container_name: creditreport_scheduler_prod
    restart: always

    command: php artisan schedule:work

    volumes:
      - storage_data:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs

    environment:
      APP_ENV: production

    networks:
      - creditreport_network_prod

    depends_on:
      app:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# =============================================================================
# REDES
# =============================================================================
networks:
  creditreport_network_prod:
    driver: bridge
    name: creditreport_network_prod
    # Configuración de red más segura
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"

# =============================================================================
# VOLÚMENES
# =============================================================================
volumes:
  mysql_data_prod:
    driver: local
    name: creditreport_mysql_data_prod

  mysql_backups:
    driver: local
    name: creditreport_mysql_backups

  redis_data_prod:
    driver: local
    name: creditreport_redis_data_prod

  storage_data:
    driver: local
    name: creditreport_storage_data

  app_logs:
    driver: local
    name: creditreport_app_logs

  nginx_logs:
    driver: local
    name: creditreport_nginx_logs
