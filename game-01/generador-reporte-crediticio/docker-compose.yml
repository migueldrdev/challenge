# =============================================================================
# DOCKER COMPOSE - Orquestación de Servicios para DESARROLLO
# =============================================================================
# Este archivo define todos los servicios necesarios para ejecutar la aplicación
# Laravel en un entorno de desarrollo local completamente containerizado.
#
# SERVICIOS INCLUIDOS:
# 1. app       - Contenedor PHP-FPM con Laravel (aplicación principal)
# 2. nginx     - Servidor web que sirve la aplicación y assets estáticos
# 3. db        - Base de datos MySQL 8.0 para persistencia
# 4. redis     - Cache y sistema de colas (más eficiente que database)
# 5. queue     - Worker dedicado para procesar jobs de reportes masivos
# 6. scheduler - Ejecuta tareas programadas de Laravel (cron)
# 7. mailpit   - Servidor de correo para desarrollo (captura emails)
#
# USO:
#   docker compose up -d          # Iniciar todos los servicios
#   docker compose logs -f app    # Ver logs de la aplicación
#   docker compose exec app bash  # Acceder al contenedor
#   docker compose down           # Detener todos los servicios
#
# PUERTOS EXPUESTOS:
#   - 8080: Aplicación web (Nginx)
#   - 3306: MySQL (para clientes externos como DBeaver/TablePlus)
#   - 6379: Redis (para debugging)
#   - 8025: Mailpit UI (ver emails capturados)
#   - 5173: Vite HMR (Hot Module Replacement para assets)
# =============================================================================

# Versión de la especificación de Compose
# La versión 3.8 es compatible con Docker 19.03+ y soporta todas las features modernas
version: '3.8'

# =============================================================================
# DEFINICIÓN DE SERVICIOS
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # APP - Contenedor principal PHP-FPM con Laravel
  # ---------------------------------------------------------------------------
  # Este es el corazón de la aplicación. Ejecuta PHP-FPM que procesa
  # las peticiones PHP enviadas por Nginx.
  #
  # RESPONSABILIDADES:
  # - Ejecutar código PHP de Laravel
  # - Procesar requests HTTP (a través de Nginx)
  # - Generar reportes crediticios
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development  # Usa el stage de desarrollo del Dockerfile
      args:
        # USER_ID y GROUP_ID deben coincidir con tu usuario local
        # Esto evita problemas de permisos con archivos montados
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: creditreport_app
    restart: unless-stopped
    working_dir: /var/www/html

    # Volúmenes montados
    volumes:
      # Código fuente - montado para ver cambios en tiempo real
      - .:/var/www/html
      # Caché de Composer persistente (acelera composer install)
      - composer_cache:/home/laravel/.composer/cache

    # Variables de entorno del contenedor
    environment:
      # Conexión a servicios Docker
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # PHP configuración
      PHP_MEMORY_LIMIT: 512M

    # Redes a las que pertenece
    networks:
      - creditreport_network

    # Dependencias - espera a que estos servicios estén listos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    # Healthcheck para verificar que PHP-FPM está funcionando
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # NGINX - Servidor Web
  # ---------------------------------------------------------------------------
  # Nginx actúa como servidor web y reverse proxy.
  # Sirve archivos estáticos directamente y envía requests PHP a PHP-FPM.
  #
  # RESPONSABILIDADES:
  # - Servir archivos estáticos (CSS, JS, imágenes)
  # - Proxy de requests PHP a PHP-FPM (app)
  # - Servir reportes Excel generados desde storage/app/public
  # - Manejar SSL en producción (no en desarrollo)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: creditreport_nginx
    restart: unless-stopped

    # Puerto 8080 del host -> Puerto 80 del contenedor
    ports:
      - "${APP_PORT:-8080}:80"

    volumes:
      # Código fuente (Nginx necesita acceso a archivos estáticos)
      - .:/var/www/html:ro  # Read-only para seguridad
      # Configuración personalizada de Nginx
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - creditreport_network

    depends_on:
      - app

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # DB - Base de Datos MySQL 8.0
  # ---------------------------------------------------------------------------
  # MySQL almacena todos los datos de la aplicación:
  # - Subscriptions y SubscriptionReports
  # - ReportLoans, ReportCreditCards, ReportOtherDebts
  # - Jobs queue (cuando se usa database driver)
  # - Cache y sessions (cuando se usa database driver)
  #
  # CONSIDERACIONES PARA REPORTES MASIVOS:
  # - Configurado con buffer pool grande para consultas complejas
  # - Log binario deshabilitado en desarrollo para mejor rendimiento
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: creditreport_db
    restart: unless-stopped

    # Puerto expuesto para clientes externos (DBeaver, TablePlus, etc.)
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-creditreport}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}

    volumes:
      # Persistencia de datos - sobrevive a docker compose down
      - mysql_data:/var/lib/mysql
      # Script de inicialización (se ejecuta solo la primera vez)
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Configuración personalizada de MySQL
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro

    networks:
      - creditreport_network

    # Healthcheck - verifica que MySQL esté listo para conexiones
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # REDIS - Cache y Sistema de Colas
  # ---------------------------------------------------------------------------
  # Redis proporciona:
  # - Sistema de colas más eficiente que database (recomendado para jobs masivos)
  # - Cache de aplicación (config, routes, views)
  # - Session storage (opcional)
  #
  # IMPORTANTE PARA TU PROYECTO:
  # Los jobs de GenerateCreditReportJob se benefician enormemente de Redis
  # ya que es más rápido para encolar y desencolar tareas.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: creditreport_redis
    restart: unless-stopped

    # Puerto expuesto para debugging con redis-cli
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"

    # Comando con configuración de memoria
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      # Persistencia de datos Redis
      - redis_data:/data

    networks:
      - creditreport_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # QUEUE - Worker para Procesar Jobs de Reportes
  # ---------------------------------------------------------------------------
  # Este contenedor ejecuta el queue worker de Laravel dedicado a procesar
  # los jobs de GenerateCreditReportJob.
  #
  # CONFIGURACIÓN ESPECIAL:
  # - timeout=0: Sin límite de tiempo (los reportes masivos pueden tardar)
  # - tries=3: Reintentar jobs fallidos hasta 3 veces
  # - memory=512: Suficiente memoria para procesar reportes grandes
  #
  # ESCALABILIDAD:
  # Puedes escalar este servicio para procesar más jobs en paralelo:
  #   docker compose up -d --scale queue=3
  # ---------------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: creditreport_queue
    restart: unless-stopped
    working_dir: /var/www/html

    # Comando que ejecuta el queue worker
    # --timeout=0: Jobs de reportes masivos pueden tardar mucho
    # --sleep=3: Espera 3 segundos cuando no hay jobs
    # --tries=3: Reintentar jobs fallidos
    # --memory=512: Límite de memoria antes de reiniciar worker
    command: >
      sh -c "
        echo 'Esperando a que la aplicación esté lista...' &&
        sleep 10 &&
        php artisan queue:work redis --timeout=0 --sleep=3 --tries=3 --memory=512 --verbose
      "

    volumes:
      - .:/var/www/html
      - composer_cache:/home/laravel/.composer/cache

    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis  # Usar Redis para colas

    networks:
      - creditreport_network

    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # SCHEDULER - Tareas Programadas de Laravel
  # ---------------------------------------------------------------------------
  # Ejecuta el scheduler de Laravel cada minuto, simulando cron.
  # Útil si tienes tareas programadas como:
  # - Limpieza de reportes antiguos
  # - Generación automática de reportes
  # - Estadísticas periódicas
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: creditreport_scheduler
    restart: unless-stopped
    working_dir: /var/www/html

    # Ejecuta schedule:work que corre el scheduler continuamente
    command: >
      sh -c "
        echo 'Esperando a que la aplicación esté lista...' &&
        sleep 15 &&
        php artisan schedule:work
      "

    volumes:
      - .:/var/www/html

    environment:
      DB_HOST: db
      REDIS_HOST: redis

    networks:
      - creditreport_network

    depends_on:
      app:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # MAILPIT - Servidor de Correo para Desarrollo
  # ---------------------------------------------------------------------------
  # Mailpit captura todos los emails enviados por la aplicación.
  # Útil para:
  # - Probar notificaciones de reportes completados
  # - Debugging de emails sin enviarlos realmente
  # - Ver el contenido y formato de emails
  #
  # Accede a la UI en: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: creditreport_mailpit
    restart: unless-stopped

    ports:
      # UI web para ver emails
      - "${MAILPIT_UI_PORT:-8025}:8025"
      # Puerto SMTP para enviar emails
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

    networks:
      - creditreport_network

  # ---------------------------------------------------------------------------
  # NODE - Compilación de Assets (Desarrollo)
  # ---------------------------------------------------------------------------
  # Contenedor para ejecutar Vite y compilar assets frontend.
  # En desarrollo, mantiene HMR (Hot Module Replacement) activo.
  #
  # NOTA: En producción, los assets se pre-compilan y este servicio no existe.
  # ---------------------------------------------------------------------------
  node:
    image: node:20-alpine
    container_name: creditreport_node
    working_dir: /var/www/html

    # Ejecuta npm install y luego vite en modo desarrollo
    command: >
      sh -c "
        npm install &&
        npm run dev -- --host 0.0.0.0
      "

    ports:
      # Puerto Vite HMR
      - "${VITE_PORT:-5173}:5173"

    volumes:
      - .:/var/www/html
      # Cache de npm separado para mejor rendimiento
      - node_modules:/var/www/html/node_modules

    networks:
      - creditreport_network

# =============================================================================
# REDES
# =============================================================================
# Red interna para comunicación entre contenedores.
# Todos los servicios pueden comunicarse usando sus nombres como hostname.
# Ejemplo: desde 'app' puedes conectar a MySQL usando 'db:3306'
# =============================================================================
networks:
  creditreport_network:
    driver: bridge
    name: creditreport_network

# =============================================================================
# VOLÚMENES
# =============================================================================
# Volúmenes nombrados para persistencia de datos.
# Estos datos sobreviven a 'docker compose down' pero se eliminan con
# 'docker compose down -v'
# =============================================================================
volumes:
  # Datos de MySQL - CRÍTICO: contiene todos los datos de la aplicación
  mysql_data:
    driver: local
    name: creditreport_mysql_data

  # Datos de Redis - Cache y jobs en cola
  redis_data:
    driver: local
    name: creditreport_redis_data

  # Cache de Composer - Acelera instalación de dependencias
  composer_cache:
    driver: local
    name: creditreport_composer_cache

  # Node modules - Separado para mejor rendimiento en macOS/Windows
  node_modules:
    driver: local
    name: creditreport_node_modules
